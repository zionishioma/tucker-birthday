<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Tucker!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 90%;
      width: 350px;
      margin: 20px;
      animation: popIn 0.8s ease-out;
    }
    h1 {
      color: #ff4757;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
    }
    .balloon {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: float 2s ease-in-out infinite alternate;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: #ff4757;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.2s;
    }
    button:active {
      transform: scale(0.95);
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-15px); }
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="balloon">🎈🎂🎉</div>
    <h1>Happy Birthday, Tucker!</h1>
    <p>Wishing you the happiest of birthdays today! May your year ahead be full of fun, happiness, and incredible memories.</p>
    <button onclick="alert('🎂 Have an amazing day!')">Tap for a surprise! 🎉</button>
  </div>

</body>
</html>
